name: Publiser til Expo Go
# Publiserer appen til Expo (EAS Update) så den kan åpnes i Expo Go på iPhone – uten server/PC.
# Krever repo-secret EXPO_TOKEN. Start manuelt fra GitHub, eller automatisk ved push.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Sjekk at EXPO_TOKEN finnes
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "## Mangler EXPO_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "Legg til secret EXPO_TOKEN (se docs/TESTING.md), og kjør workflowen på nytt." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::EXPO_TOKEN mangler"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --global eas-cli
      - name: Koble til Expo-prosjekt
        run: eas init --non-interactive --force
      - name: Sett oppdaterings-URL
        run: |
          PID=$(node -e "console.log(require('./app.json').expo.extra.eas.projectId)")
          node -e "
            const fs=require('fs'); const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.updates={url:'https://u.expo.dev/$PID'}; fs.writeFileSync('app.json',JSON.stringify(j,null,2));"
          echo "PROJECT_ID=$PID" >> "$GITHUB_ENV"
      - name: Publiser
        run: |
          eas update --branch preview --platform ios --message "${GITHUB_SHA::7}" --non-interactive --json > update.json
          cat update.json
      - name: Lag lenke til Expo Go
        run: |
          GROUP=$(node -e "const u=JSON.parse(require('fs').readFileSync('update.json','utf8'));console.log((Array.isArray(u)?u[0]:u).group)")
          {
            echo "## Appen er publisert"
            echo
            echo "1. Installer **Expo Go** fra App Store (hvis du ikke har den)."
            echo "2. Åpne Safari, lim inn denne adressen og trykk Gå → **Åpne i Expo Go**:"
            echo
            echo '```'
            echo "exp://u.expo.dev/${PROJECT_ID}/group/${GROUP}"
            echo '```'
            echo
            echo "Reservevei: åpne Expo Go → fanen **Projects** hvis den dukker opp der."
            echo "Merk: automatisk tekstlesing fra bilde virker ikke i Expo Go."
          } >> "$GITHUB_STEP_SUMMARY"
