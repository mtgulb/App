name: Publiser oppdatering (EAS Update)
# preview: automatisk ved push (for testing i Expo Go / TestFlight-bygg på preview-kanalen).
# production: KUN manuelt, fra main, med skrevet bekreftelse og godkjenning i GitHub-miljøet «production».
# En oppdatering når bare bygg med samme native fingeravtrykk. Nye native pakker/innstillinger krever nytt bygg.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Kanal
        type: choice
        options: [preview, production]
        default: preview
      confirm:
        description: Skriv PUBLISER for å publisere til production
        type: string
        default: ''
  push:
    branches: [main, 'claude/**']
concurrency:
  group: eas-update-${{ github.ref }}-${{ inputs.channel || 'preview' }}
  cancel-in-progress: true
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    # Miljøet bestemmer hvilke variabler (SUPABASE_URL …) og hvilke godkjenninger som gjelder.
    environment: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CHANNEL: ${{ inputs.channel || 'preview' }}
    steps:
      - name: Vern mot utilsiktet produksjonspublisering
        if: ${{ inputs.channel == 'production' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "PUBLISER" ]; then
            echo "::error::Production krever at du skriver PUBLISER i bekreftelsesfeltet."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production kan bare publiseres fra main."
            exit 1
          fi
      - name: Sjekk at EXPO_TOKEN finnes
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "## Mangler EXPO_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::EXPO_TOKEN mangler (se docs/TESTING.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --global eas-cli
      - name: Koble til Expo-prosjekt
        run: eas init --non-interactive --force
      - name: Sett oppdaterings-URL
        run: |
          PID=$(node -e "console.log(require('./app.json').expo.extra.eas.projectId)")
          node -e "
            const fs=require('fs'); const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.updates={url:'https://u.expo.dev/$PID'}; fs.writeFileSync('app.json',JSON.stringify(j,null,2));"
          echo "PROJECT_ID=$PID" >> "$GITHUB_ENV"
      - name: Publiser
        env:
          # Offentlige verdier (GitHub-variabler per miljø, ikke secrets). Tomme = familiedeling er av.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          eas update --branch "$CHANNEL" --platform ios --message "${GITHUB_SHA::7}" --non-interactive --json > update.json
          cat update.json
      - name: Lag lenke til Expo Go
        run: |
          GROUP=$(node -e "const u=JSON.parse(require('fs').readFileSync('update.json','utf8'));console.log((Array.isArray(u)?u[0]:u).group)")
          {
            echo "## Oppdatering publisert til «$CHANNEL»"
            echo
            echo "Åpne i Expo Go (Safari → lim inn → Åpne i Expo Go):"
            echo
            echo '```'
            echo "exp://u.expo.dev/${PROJECT_ID}/group/${GROUP}"
            echo '```'
            echo
            echo "Installerte TestFlight-bygg på kanalen «$CHANNEL» henter oppdateringen automatisk ved neste oppstart (hvis native fingeravtrykk er likt)."
          } >> "$GITHUB_STEP_SUMMARY"
