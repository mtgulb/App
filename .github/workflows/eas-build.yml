name: EAS Build (manuell)
# Start fra iPhone: GitHub-appen/nettleser -> Actions -> "EAS Build (manuell)" -> Run workflow.
# Krever repo-secret EXPO_TOKEN og en Expo-konto med Apple Developer-tilkobling.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Byggprofil
        type: choice
        options: [development, preview, production]
        default: preview
      submit:
        description: Send til TestFlight etter bygg (kun production)
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Bygg
        if: ${{ !(inputs.submit && inputs.profile == 'production') }}
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
      - name: Bygg og send til TestFlight
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
