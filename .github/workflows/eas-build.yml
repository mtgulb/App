name: EAS Build og TestFlight (manuell)
# Krever Apple Developer-konto og EXPO_TOKEN. Start: GitHub → Actions → denne flyten → Run workflow.
# preview: intern distribusjon. production: kun fra main, med skrevet bekreftelse og godkjenning.
# Innsending til TestFlight/App Store skjer aldri uten at du har skrevet PUBLISER og godkjent miljøet «production».
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Byggprofil
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Send til TestFlight etter bygg (kun production)
        type: boolean
        default: false
      confirm:
        description: Skriv PUBLISER for production-bygg
        type: string
        default: ''
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  build:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Apple (kun i miljøet «production»): nøkkel fra App Store Connect, lagt inn som GitHub-secrets.
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE }}
    steps:
      - name: Vern mot utilsiktet produksjonsbygg
        if: ${{ inputs.profile == 'production' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "PUBLISER" ]; then
            echo "::error::Production krever at du skriver PUBLISER i bekreftelsesfeltet."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production kan bare bygges fra main."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Skriv App Store Connect-nøkkelen til en midlertidig fil
        if: ${{ inputs.profile == 'production' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$EXPO_ASC_KEY_ID" ] || [ -z "$EXPO_ASC_ISSUER_ID" ] || [ -z "$EXPO_APPLE_TEAM_ID" ]; then
            echo "::error::Mangler Apple-secrets (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID) i miljøet production. Se docs/BRUKSANVISNING.md."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"
      - name: Bygg
        if: ${{ !(inputs.submit && inputs.profile == 'production') }}
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
      - name: Bygg og send til TestFlight
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
