name: Send bygg til TestFlight (manuell)
# Sender et ferdig EAS-bygg til TestFlight (ikke til App Store-publisering; den må du selv sende til vurdering i App Store Connect).
# Kun fra main, med skrevet bekreftelse og godkjenning i GitHub-miljøet «production».
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS bygg-ID (fra expo.dev → Builds)
        type: string
        required: true
      confirm:
        description: Skriv TESTFLIGHT for å sende bygget
        type: string
        default: ''
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE }}
    steps:
      - name: Vern mot utilsiktet innsending
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [ "$CONFIRM" != "TESTFLIGHT" ]; then
            echo "::error::Skriv TESTFLIGHT i bekreftelsesfeltet."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Kan bare sendes fra main."
            exit 1
          fi
          if ! printf '%s' "$BUILD_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::Bygg-ID må være en UUID."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Gjør App Store Connect-nøkkelen tilgjengelig for innsendingen (kun på kjøreren, committes aldri)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$EXPO_ASC_KEY_ID" ] || [ -z "$EXPO_ASC_ISSUER_ID" ]; then
            echo "::error::Mangler Apple-secrets i miljøet production."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > ./asc-key.p8
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('eas.json','utf8'));
            const ios=j.submit.production.ios;
            ios.ascApiKeyPath='./asc-key.p8';
            ios.ascApiKeyId=process.env.EXPO_ASC_KEY_ID;
            ios.ascApiKeyIssuerId=process.env.EXPO_ASC_ISSUER_ID;
            fs.writeFileSync('eas.json',JSON.stringify(j,null,2));
          "
      - name: Send til TestFlight
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive
