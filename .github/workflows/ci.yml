name: CI
# Kontroller som alltid må bestå før noe bygges eller publiseres:
# typesjekk, lint, formattering og alle tester (inkl. tilgangsregler i databasen).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
