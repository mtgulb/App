name: Supabase – kjør databaseendringer
# Kjører filene i supabase/migrations mot ditt Supabase-prosjekt.
# Krever repo-secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
# Start manuelt: Actions -> denne flyten -> Run workflow. Velg «dry_run» for å se hva som vil skje uten å endre noe.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Kun vis hva som ville blitt kjørt (ingen endringer)
        type: boolean
        default: true
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Sjekk at secrets finnes
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Mangler secrets:$missing (se docs/SUPABASE.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Koble til prosjektet
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Vis ventende endringer
        run: supabase db push --dry-run
      - name: Kjør endringer
        if: ${{ !inputs.dry_run }}
        run: supabase db push --yes
